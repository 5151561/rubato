[package]
name = "html-compat"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
ego-tree = "0.11.0"
scraper = { version = "0.27.0", features = ["deterministic"] } # 保属性插入序(对齐 jsoup 源序输出)
# :matches / [attr~=] 用 Java 正则语义
regex-compat = { path = "../regex-compat" }
# jsoup 的 hasClass 口径只留一份(等长快路那一条)
rubato-core = { path = "../rubato-core" }
rule-syntax = { path = "../rule-syntax" }
# 与 scraper 0.27 锁同版本(直接驱动解析以关掉 scripting)
html5ever = "0.39.0"
tendril = "0.5.0"

[lints]
workspace = true
